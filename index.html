<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFF6EF">
<meta name="description" content="학교생활과 학생회 활동 속 상황으로 알아보는 나의 리더십 유형 테스트">
<meta property="og:title" content="나는 어떤 리더일까?">

<title>나는 어떤 리더일까?</title>
<style>
  :root {
    --bg: #FFF6EF;
    --bg2: #F3EEFF;
    --card: #FFFFFF;
    --text: #36314D;
    --sub: #6E6888;
    --line: #ECE6F4;
    --accent: #6B5BE0;
    --accent-soft: #EEEBFF;
    --danger: #E86A6A;
    --L: #F7A8C0; --L-soft: #FFEAF1; --L-deep: #D9577F;
    --D: #FFBE7A; --D-soft: #FFF1E1; --D-deep: #D9822B;
    --M: #8FD6BE; --M-soft: #E5F7F0; --M-deep: #2F9A76;
    --C: #B5A3F2; --C-soft: #F0ECFF; --C-deep: #6E57D6;
    --radius: 24px;
    --shadow: 0 8px 24px rgba(90, 70, 140, 0.10);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", "Malgun Gothic", "맑은 고딕", sans-serif;
    font-size: 17px;
    line-height: 1.6;
    color: var(--text);
    background: linear-gradient(180deg, var(--bg) 0%, var(--bg2) 100%);
    background-attachment: fixed;
    min-height: 100vh;
    word-break: keep-all;
    overflow-wrap: break-word;
  }
  #app {
    max-width: 520px;
    margin: 0 auto;
    padding: 20px 16px calc(40px + env(safe-area-inset-bottom));
  }
  h1, h2, h3, p { margin: 0; }
  button { font-family: inherit; font-size: inherit; color: inherit; }
  .fade-in { animation: fadeIn .35s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  /* 공통 카드 & 버튼 */
  .card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 22px 20px;
    margin-bottom: 16px;
  }
  .btn {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    width: 100%;
    min-height: 58px;
    padding: 14px 20px;
    border: none;
    border-radius: 18px;
    font-size: 18px;
    font-weight: 700;
    cursor: pointer;
    transition: transform .1s ease, box-shadow .2s ease, background .2s ease, opacity .2s;
    text-align: center;
    line-height: 1.35;
  }
  .btn:active { transform: scale(0.98); }
  .btn-primary { background: var(--accent); color: #fff; box-shadow: 0 6px 16px rgba(107, 91, 224, .3); }
  .btn-secondary { background: #fff; color: var(--text); border: 2px solid var(--line); }
  .btn-soft { background: var(--accent-soft); color: var(--accent); }
  .btn.is-disabled { background: #D9D5E6; color: #fff; box-shadow: none; }
  .btn-row { display: flex; gap: 10px; }
  .btn-row .btn { flex: 1; }
  .btn-row .btn-prev { flex: 0 0 38%; }
  .stack > * + * { margin-top: 10px; }
  .link-btn {
    background: none; border: none; color: var(--sub); text-decoration: underline;
    font-size: 15px; padding: 12px; cursor: pointer; display: block; margin: 6px auto 0;
  }

  /* 시작 화면 */
  .hero-art { display: block; width: 100%; max-width: 340px; margin: 4px auto 0; }
  .bob { animation: bob 3s ease-in-out infinite; transform-origin: center; }
  .bob.d1 { animation-delay: .4s; } .bob.d2 { animation-delay: .8s; } .bob.d3 { animation-delay: 1.2s; }
  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
  .badge {
    display: inline-block; padding: 6px 14px; border-radius: 999px;
    background: var(--accent-soft); color: var(--accent); font-size: 14px; font-weight: 700;
  }
  .title-wrap { text-align: center; margin: 8px 0 18px; }
  .title-wrap h1 { font-size: 32px; line-height: 1.3; margin-top: 10px; letter-spacing: -0.5px; }
  .title-wrap p { color: var(--sub); margin-top: 10px; font-size: 16.5px; }
  .pills { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: 4px 0 18px; }
  .pill { background: #fff; border-radius: 999px; padding: 8px 14px; font-size: 14.5px; font-weight: 600; box-shadow: 0 3px 10px rgba(90,70,140,.08); }
  .type-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .type-chip { border-radius: 18px; padding: 14px 12px; text-align: center; }
  .type-chip .emo { font-size: 30px; line-height: 1.2; }
  .type-chip b { display: block; font-size: 16px; margin-top: 4px; }
  .type-chip span { display: block; font-size: 13px; color: var(--sub); line-height: 1.45; margin-top: 2px; }
  .note { font-size: 14.5px; color: var(--sub); text-align: center; margin-top: 14px; }
  .section-label { font-size: 15px; font-weight: 700; color: var(--sub); margin-bottom: 12px; }

  /* 문항 화면 */
  .progress-head { display: flex; justify-content: space-between; align-items: center; margin: 4px 2px 8px; font-weight: 700; }
  .progress-head .count { color: var(--accent); font-size: 16px; }
  .progress-head .home { background: none; border: none; color: var(--sub); font-size: 15px; padding: 8px 4px; cursor: pointer; }
  .progress { height: 12px; background: #fff; border-radius: 999px; overflow: hidden; box-shadow: inset 0 1px 3px rgba(0,0,0,.06); }
  .progress > div { height: 100%; background: linear-gradient(90deg, #A79BFF, var(--accent)); border-radius: 999px; transition: width .35s ease; }
  .dots { display: flex; gap: 6px; justify-content: center; margin: 12px 0 16px; flex-wrap: wrap; }
  .dots i { width: 9px; height: 9px; border-radius: 50%; background: #DDD8EA; display: block; }
  .dots i.done { background: #A79BFF; }
  .dots i.now { background: var(--accent); transform: scale(1.35); }
  .q-card { text-align: center; padding-top: 26px; }
  .q-emoji { font-size: 46px; line-height: 1; width: 84px; height: 84px; margin: 0 auto 12px; border-radius: 50%; background: var(--accent-soft); display: flex; align-items: center; justify-content: center; }
  .q-num { font-size: 14px; color: var(--accent); font-weight: 800; letter-spacing: 1px; }
  .q-text { font-size: 21px; line-height: 1.5; margin-top: 6px; font-weight: 800; }
  .q-sub { color: var(--sub); font-size: 15px; margin-top: 6px; }
  .options { margin-bottom: 16px; }
  .opt {
    display: flex; align-items: flex-start; gap: 12px;
    width: 100%; text-align: left;
    background: #fff; border: 2.5px solid transparent; border-radius: 20px;
    padding: 16px 16px; margin-bottom: 10px; min-height: 64px;
    box-shadow: 0 4px 14px rgba(90,70,140,.08);
    cursor: pointer; font-size: 16.5px; line-height: 1.55;
    transition: border-color .15s, background .15s, transform .1s;
  }
  .opt:active { transform: scale(0.985); }
  .opt .letter {
    flex: 0 0 34px; height: 34px; border-radius: 50%;
    background: var(--accent-soft); color: var(--accent);
    font-weight: 800; display: flex; align-items: center; justify-content: center; font-size: 16px;
    transition: background .15s, color .15s;
  }
  .opt .txt { flex: 1; padding-top: 4px; }
  .opt .check { flex: 0 0 24px; height: 24px; margin-top: 5px; opacity: 0; transition: opacity .15s; color: var(--accent); font-weight: 900; font-size: 20px; line-height: 24px; text-align: center; }
  .opt.selected { border-color: var(--accent); background: #F7F5FF; }
  .opt.selected .letter { background: var(--accent); color: #fff; }
  .opt.selected .check { opacity: 1; }
  .hint { text-align: center; color: var(--sub); font-size: 14.5px; margin-top: 12px; min-height: 22px; }

  /* 결과 화면 */
  .result-hero { text-align: center; padding: 28px 20px; position: relative; overflow: hidden; }
  .result-hero .eyebrow { font-size: 15px; color: var(--sub); font-weight: 700; }
  .result-icons { display: flex; justify-content: center; gap: 10px; margin: 14px 0 8px; flex-wrap: wrap; }
  .result-icon { width: 92px; height: 92px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 48px; animation: pop .5s ease; }
  .result-icons.multi .result-icon { width: 70px; height: 70px; font-size: 36px; }
  @keyframes pop { 0% { transform: scale(.6); opacity: 0; } 70% { transform: scale(1.08); } 100% { transform: scale(1); opacity: 1; } }
  .result-name { font-size: 28px; font-weight: 800; line-height: 1.35; margin-top: 6px; }
  .result-tagline { color: var(--sub); margin-top: 8px; font-size: 16px; }
  .score-badge { display: inline-block; margin-top: 14px; padding: 8px 16px; border-radius: 999px; font-weight: 800; font-size: 15.5px; background: var(--accent-soft); color: var(--accent); }
  .tie-note { margin-top: 14px; font-size: 15px; background: #FFF8E8; color: #8A6A1F; border-radius: 14px; padding: 12px 14px; }
  .bars .row { margin-bottom: 14px; }
  .bars .row:last-child { margin-bottom: 0; }
  .bars .lbl { display: flex; justify-content: space-between; font-size: 15.5px; font-weight: 700; margin-bottom: 6px; }
  .bars .lbl .top-tag { font-size: 12px; background: var(--accent); color: #fff; border-radius: 999px; padding: 2px 8px; margin-left: 6px; vertical-align: 2px; }
  .bars .track { height: 18px; background: #F3F0F8; border-radius: 999px; overflow: hidden; }
  .bars .fill { height: 100%; width: 0; border-radius: 999px; transition: width .9s cubic-bezier(.2,.8,.2,1); }
  .tabs { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
  .tab { flex: 1 1 40%; min-height: 50px; border-radius: 16px; border: 2px solid var(--line); background: #fff; font-weight: 700; font-size: 16px; cursor: pointer; padding: 8px; }
  .tab.active { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
  .detail-desc { font-size: 16.5px; border-radius: 18px; padding: 16px; margin-bottom: 16px; }
  .detail h3 { font-size: 18px; margin: 20px 0 10px; display: flex; align-items: center; gap: 8px; }
  .detail h3:first-of-type { margin-top: 0; }
  .list { list-style: none; padding: 0; margin: 0; }
  .list li { position: relative; padding: 12px 14px 12px 46px; background: #FAF8FD; border-radius: 14px; margin-bottom: 8px; font-size: 16px; line-height: 1.55; }
  .list li::before { position: absolute; left: 14px; top: 12px; width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 800; }
  .list.strength li::before { content: "✓"; background: #DDF4EA; color: #2F9A76; }
  .list.caution li::before { content: "!"; background: #FFE9D6; color: #D9822B; }
  .list.situation li::before { content: "★"; background: #FFF3C9; color: #C99A12; }
  .list.mission { counter-reset: m; }
  .list.mission li { counter-increment: m; cursor: pointer; user-select: none; }
  .list.mission li::before { content: counter(m); background: var(--accent-soft); color: var(--accent); }
  .list.mission li.checked { background: #EEF9F4; color: var(--sub); text-decoration: line-through; }
  .list.mission li.checked::before { content: "✓"; background: #2F9A76; color: #fff; }
  .mission-tip { font-size: 13.5px; color: var(--sub); margin-top: 4px; }
  .others .o-row { display: flex; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px dashed var(--line); }
  .others .o-row:last-child { border-bottom: none; }
  .others .o-emo { flex: 0 0 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 22px; }
  .others .o-txt { font-size: 15px; line-height: 1.5; }
  .others .o-txt b { display: block; font-size: 15.5px; }
  .vote-card { text-align: center; background: linear-gradient(135deg, #FFFFFF 0%, #F6F2FF 100%); }
  .vote-nums { display: flex; justify-content: center; gap: 12px; margin: 14px 0 10px; flex-wrap: wrap; }
  .vote-num { width: 76px; height: 76px; border-radius: 22px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: 800; }
  .vote-num big { font-size: 32px; line-height: 1; }
  .vote-num small { font-size: 12.5px; margin-top: 4px; }
  .vote-card p { font-size: 15.5px; color: var(--sub); }
  .disclaimer { background: #FFFBEF; border: 1.5px dashed #F1D58A; border-radius: 18px; padding: 16px; font-size: 14.5px; color: #6B5A2E; line-height: 1.65; margin-bottom: 16px; }
  .disclaimer b { display: block; margin-bottom: 4px; font-size: 15px; }

  /* 강사용 집계판 */
  .t-row { display: flex; align-items: center; gap: 10px; padding: 12px 0; border-bottom: 1px dashed var(--line); }
  .t-row:last-child { border-bottom: none; }
  .t-name { flex: 1; font-weight: 700; font-size: 16px; }
  .t-ctrl { display: flex; align-items: center; gap: 6px; }
  .t-ctrl button { width: 46px; height: 46px; border-radius: 14px; border: none; background: var(--accent-soft); color: var(--accent); font-size: 22px; font-weight: 800; cursor: pointer; }
  .t-ctrl input { width: 62px; height: 46px; border-radius: 14px; border: 2px solid var(--line); text-align: center; font-size: 18px; font-weight: 800; font-family: inherit; color: var(--text); }
  .t-total { text-align: center; font-size: 18px; font-weight: 800; margin: 4px 0 14px; }

  /* 성장 미션 저장 */
  .save-mission { margin-top: 14px; }
  .modal-bg {
    position: fixed; inset: 0; z-index: 40;
    background: rgba(40, 34, 60, .55);
    display: flex; align-items: flex-start; justify-content: center;
    overflow-y: auto; padding: 20px 16px calc(24px + env(safe-area-inset-bottom));
  }
  .modal {
    background: #fff; border-radius: 26px; width: 100%; max-width: 440px;
    padding: 20px 18px 18px; box-shadow: 0 20px 50px rgba(0,0,0,.25); animation: fadeIn .25s ease;
  }
  .modal h2 { font-size: 20px; text-align: center; }
  .modal .guide { text-align: center; color: var(--sub); font-size: 15px; margin: 6px 0 14px; }
  .modal .guide b { color: var(--accent); }
  .modal img { display: block; width: 100%; border-radius: 16px; box-shadow: 0 4px 16px rgba(90,70,140,.15); -webkit-touch-callout: default; }
  .modal .stack { margin-top: 14px; }

  /* 토스트 */
  #toast {
    position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom));
    transform: translateX(-50%) translateY(20px);
    background: rgba(54, 49, 77, .94); color: #fff;
    padding: 13px 20px; border-radius: 16px; font-size: 15.5px;
    opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s;
    max-width: calc(100% - 32px); text-align: center; z-index: 50;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  noscript { display: block; padding: 24px; text-align: center; }

  @media (max-width: 360px) {
    body { font-size: 16px; }
    .title-wrap h1 { font-size: 28px; }
    .q-text { font-size: 19px; }
    .opt { font-size: 15.5px; padding: 14px 13px; }
    .result-name { font-size: 24px; }
    .btn { font-size: 17px; }
  }
</style>
</head>

  /* ===================== 6. 공유 & 알림 ===================== */
  var toastTimer = null;
  function toast(msg) {
    var el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove("show"); }, 2400);
  }

  function shareText() {
    var r = computeScores(state.last);
    var name = r.top.map(function (t) { return TYPES[t].emoji + " " + TYPES[t].name; }).join(" + ");
    var kw = r.top.map(function (t) { return TYPES[t].keywords; }).join(" / ");
    return "[나는 어떤 리더일까?]\n나의 리더십 유형: " + name + "\n나의 강점: " + kw + "\n\n나도 해 보기 👉";
  }
  function pageURL() { return location.href.split("#")[0]; }

  function fallbackCopy(text) {
    try {
      var ta = document.createElement("textarea");
      ta.value = text;
      ta.setAttribute("readonly", "");
      ta.style.position = "fixed"; ta.style.top = "-1000px"; ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select(); ta.setSelectionRange(0, text.length);
      var ok = document.execCommand("copy");
      document.body.removeChild(ta);
      return ok;
    } catch (e) { return false; }
  }
  function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(function () {
        toast("결과가 복사됐어요! 메신저에 붙여 넣어 공유해 보세요.");
      }, function () {
        if (fallbackCopy(text)) toast("결과가 복사됐어요! 메신저에 붙여 넣어 공유해 보세요.");
        else window.prompt("아래 내용을 길게 눌러 복사하세요.", text);
      });
    } else if (fallbackCopy(text)) {
      toast("결과가 복사됐어요! 메신저에 붙여 넣어 공유해 보세요.");
    } else {
      window.prompt("아래 내용을 길게 눌러 복사하세요.", text);
    }
  }
  function doShare() {
    var text = shareText();
    var url = pageURL();
    if (navigator.share) {
      navigator.share({ title: "나는 어떤 리더일까?", text: text, url: url }).catch(function (err) {
        if (err && err.name === "AbortError") return; // 사용자가 공유 창을 닫음
        copyText(text + " " + url);
      });
    } else {
      copyText(text + " " + url);
    }
  }

  /* ===================== 6-1. 성장 미션 이미지 저장 ===================== */
  var PALETTE = {
    L: { bg: "#FFE3EC", deep: "#D9577F" },
    D: { bg: "#FFEBD4", deep: "#D9822B" },
    M: { bg: "#DDF4EA", deep: "#2F9A76" },
    C: { bg: "#EAE4FF", deep: "#6E57D6" }
  };
  var FONT = '-apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", "Noto Sans CJK KR", "Malgun Gothic", sans-serif';

  function rr(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }
  // 한국어 줄바꿈: 띄어쓰기 단위로 나누고, 한 단어가 너무 길면 글자 단위로 나눔
  function wrapLines(ctx, text, maxW) {
    var words = text.split(" "), lines = [], line = "";
    for (var i = 0; i < words.length; i++) {
      var test = line ? line + " " + words[i] : words[i];
      if (ctx.measureText(test).width <= maxW) { line = test; continue; }
      if (line) lines.push(line);
      line = words[i];
      while (ctx.measureText(line).width > maxW) {
        var cut = line.length - 1;
        while (cut > 1 && ctx.measureText(line.slice(0, cut)).width > maxW) cut--;
        lines.push(line.slice(0, cut));
        line = line.slice(cut);
      }
    }
    if (line) lines.push(line);
    return lines;
  }

  function makeMissionImage(t) {
    var W = 1080, H = 1350, T = TYPES[t], P = PALETTE[t];
    var r = computeScores(state.last);
    var cv = document.createElement("canvas");
    cv.width = W; cv.height = H;
    var ctx = cv.getContext("2d");
    ctx.textBaseline = "alphabetic";

    // 배경
    ctx.fillStyle = P.bg; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = "rgba(255,255,255,.45)";
    ctx.beginPath(); ctx.arc(W - 40, 60, 170, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(30, H - 120, 120, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#fff"; rr(ctx, 56, 56, W - 112, H - 112, 48); ctx.fill();

    ctx.textAlign = "center";
    // 상단
    ctx.fillStyle = "#6B5BE0"; ctx.font = "700 32px " + FONT;
    ctx.fillText("나는 어떤 리더일까?", W / 2, 140);
    ctx.fillStyle = P.bg; ctx.beginPath(); ctx.arc(W / 2, 255, 82, 0, Math.PI * 2); ctx.fill();
    ctx.font = "88px " + FONT; ctx.fillStyle = "#000";
    ctx.fillText(T.emoji, W / 2, 287);

    ctx.fillStyle = "#6E6888"; ctx.font = "600 32px " + FONT;
    ctx.fillText("나의 리더십 유형", W / 2, 390);
    var title = r.top.length > 1 ? r.top.map(function (k) { return TYPES[k].short; }).join(" + ") + " 리더" : T.name;
    var size = 72;
    ctx.font = "800 " + size + "px " + FONT;
    while (ctx.measureText(title).width > W - 200 && size > 40) { size -= 4; ctx.font = "800 " + size + "px " + FONT; }
    ctx.fillStyle = "#36314D"; ctx.fillText(title, W / 2, 470);
    ctx.fillStyle = P.deep; ctx.font = "700 34px " + FONT;
    ctx.fillText(T.keywords, W / 2, 530);

    // 미션 제목
    ctx.fillStyle = "#36314D"; ctx.font = "800 42px " + FONT;
    var head = r.top.length > 1 ? "🎯 " + T.short + " 리더 성장 미션" : "🎯 나의 성장 미션";
    ctx.fillText(head, W / 2, 625);

    // 미션 3개
    var boxX = 110, boxW = W - 220, textX = boxX + 112, textW = boxW - 140, lineH = 52, y = 668;
    ctx.font = "600 36px " + FONT;
    T.missions.forEach(function (m, i) {
      var lines = wrapLines(ctx, m, textW);
      var bh = Math.max(110, lines.length * lineH + 52);
      var done = !!state.missions[t + i];
      ctx.fillStyle = done ? "#EEF9F4" : "#FAF8FD"; rr(ctx, boxX, y, boxW, bh, 28); ctx.fill();
      ctx.fillStyle = done ? "#2F9A76" : P.bg;
      ctx.beginPath(); ctx.arc(boxX + 56, y + bh / 2, 28, 0, Math.PI * 2); ctx.fill();
      ctx.textAlign = "center"; ctx.fillStyle = done ? "#fff" : P.deep; ctx.font = "800 30px " + FONT;
      ctx.fillText(done ? "✓" : String(i + 1), boxX + 56, y + bh / 2 + 11);
      ctx.textAlign = "left"; ctx.fillStyle = "#36314D"; ctx.font = "600 36px " + FONT;
      var ty = y + (bh - lines.length * lineH) / 2 + 38;
      lines.forEach(function (ln, j) { ctx.fillText(ln, textX, ty + j * lineH); });
      y += bh + 20;
    });

    // 하단
    var d = new Date();
    ctx.textAlign = "center"; ctx.fillStyle = "#9C96B3"; ctx.font = "500 26px " + FONT;
    ctx.fillText(d.getFullYear() + ". " + (d.getMonth() + 1) + ". " + d.getDate() + ". 학생회 리더십 캠프", W / 2, H - 132);
    ctx.font = "500 22px " + FONT;
    ctx.fillText("자기 성찰을 위한 교육 활동 결과이며, 과학적으로 검증된 심리검사가 아니에요.", W / 2, H - 92);
    return cv;
  }

  var modalEl = null;
  function closeModal() {
    if (modalEl && modalEl.parentNode) modalEl.parentNode.removeChild(modalEl);
    modalEl = null;
    document.body.style.overflow = "";
  }
  function openMissionSaver(t) {
    var cv;
    try { cv = makeMissionImage(t); } catch (e) { toast("이미지를 만들지 못했어요. 화면을 캡처해서 저장해 주세요."); return; }
    var url = cv.toDataURL("image/png");
    var fileName = "나의_성장미션_" + TYPES[t].short + ".png";
    var canShareFile = false, file = null;
    try {
      if (window.File && navigator.canShare) {
        var bin = atob(url.split(",")[1]), arr = new Uint8Array(bin.length);
        for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
        file = new File([arr], fileName, { type: "image/png" });
        canShareFile = navigator.canShare({ files: [file] });
      }
    } catch (e) { canShareFile = false; }

    closeModal();
    modalEl = document.createElement("div");
    modalEl.className = "modal-bg";
    modalEl.setAttribute("role", "dialog");
    modalEl.setAttribute("aria-modal", "true");
    modalEl.innerHTML = '<div class="modal">' +
      '<h2>📥 내 성장 미션 저장</h2>' +
      '<p class="guide">이미지를 <b>길게 눌러</b> 사진에 저장하세요.<br>또는 아래 버튼을 눌러 저장할 수 있어요.</p>' +
      '<img alt="나의 성장 미션 이미지" src="' + url + '">' +
      '<div class="stack">' +
      (canShareFile ? '<button class="btn btn-primary" data-m="share">📲 사진·메신저로 저장하기</button>' : '') +
      '<button class="btn ' + (canShareFile ? 'btn-secondary' : 'btn-primary') + '" data-m="download">⬇️ 이미지 파일로 내려받기</button>' +
      '<button class="btn btn-secondary" data-m="close">닫기</button>' +
      '</div></div>';
    document.body.appendChild(modalEl);
    document.body.style.overflow = "hidden";

    modalEl.addEventListener("click", function (e) {
      if (e.target === modalEl) { closeModal(); return; }
      var b = e.target.closest ? e.target.closest("[data-m]") : null;
      if (!b) return;
      var m = b.getAttribute("data-m");
      if (m === "close") closeModal();
      else if (m === "download") {
        try {
          var a = document.createElement("a");
          a.href = url; a.download = fileName;
          document.body.appendChild(a); a.click(); document.body.removeChild(a);
          toast("저장을 시작했어요. 안 되면 이미지를 길게 눌러 저장하세요.");
        } catch (err) { toast("이미지를 길게 눌러 저장해 주세요."); }
      } else if (m === "share" && file) {
        navigator.share({ files: [file], title: "나의 성장 미션" }).catch(function (err) {
          if (err && err.name === "AbortError") return;
          toast("이미지를 길게 눌러 저장해 주세요.");
        });
      }
    });
  }
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && modalEl) closeModal(); });

  /* ===================== 7. 버튼 동작 ===================== */
  function firstUnanswered() { for (var i = 0; i < TOTAL; i++) if (state.answers[i] === null) return i; return -1; }

  app.addEventListener("click", function (e) {
    var el = e.target.closest ? e.target.closest("[data-act]") : null;
    if (!el) return;
    var act = el.getAttribute("data-act");

    switch (act) {
      case "start":
        state.answers = blankAnswers(); state.current = 0; go("quiz"); break;
      case "continue": {
        var f = firstUnanswered();
        state.current = f >= 0 ? f : TOTAL - 1;
        go("quiz"); break;
      }
      case "restart":
        if (window.confirm("지금까지 고른 답이 지워져요. 처음부터 다시 할까요?")) {
          state.answers = blankAnswers(); state.current = 0; go("quiz");
        }
        break;
      case "view-last":
        state.tab = 0; go("result"); break;
      case "home":
        go("start"); break;
      case "pick": {
        var idx = parseInt(el.getAttribute("data-idx"), 10);
        state.answers[state.current] = idx;
        saveState();
        renderQuiz();
        break;
      }
      case "prev":
        if (state.current > 0) { state.current -= 1; saveState(); renderQuiz(); window.scrollTo(0, 0); }
        else go("start");
        break;
      case "next": {
        if (state.answers[state.current] === null) {
          var hint = document.getElementById("hint");
          if (hint) hint.textContent = "⚠️ 답을 먼저 골라 주세요!";
          toast("답을 하나 골라야 다음으로 넘어갈 수 있어요.");
          break;
        }
        if (state.current < TOTAL - 1) {
          state.current += 1; saveState(); renderQuiz(); window.scrollTo(0, 0);
        } else {
          var miss = firstUnanswered();
          if (miss >= 0) {
            state.current = miss; saveState(); renderQuiz(); window.scrollTo(0, 0);
            toast((miss + 1) + "번 문항에 아직 답하지 않았어요.");
          } else {
            state.last = state.answers.slice();
            state.answers = blankAnswers(); // 완료 후 진행 중 상태 초기화 → 처음 화면에 '지난 결과 다시 보기'만 표시
            state.current = 0;
            state.missions = {};
            state.tab = 0;
            go("result");
          }
        }
        break;
      }
      case "tab":
        state.tab = parseInt(el.getAttribute("data-idx"), 10) || 0;
        renderResult();
        break;
      case "mission": {
        var id = el.getAttribute("data-id");
        state.missions[id] = !state.missions[id];
        saveState();
        el.classList.toggle("checked", !!state.missions[id]);
        el.setAttribute("aria-checked", String(!!state.missions[id]));
        if (state.missions[id]) toast("멋져요! 미션 하나 완료 🎉");
        break;
      }
      case "share":
        doShare(); break;
      case "save-mission":
        openMissionSaver(el.getAttribute("data-type")); break;
      case "retest":
        if (window.confirm("새로 테스트를 시작할까요? 지금 결과는 '지난 결과 다시 보기'로 다시 볼 수 있어요.")) {
          state.answers = blankAnswers(); state.current = 0; go("quiz");
        }
        break;
      /* 강사용 */
      case "t-plus":
      case "t-minus": {
        var k = el.getAttribute("data-k");
        tally[k] = Math.max(0, Math.min(999, tally[k] + (act === "t-plus" ? 1 : -1)));
        saveTally(); renderTeacher(); break;
      }
      case "t-reset":
        if (window.confirm("입력한 숫자를 모두 0으로 바꿀까요?")) {
          tally = { L: 0, D: 0, M: 0, C: 0 }; saveTally(); renderTeacher();
        }
        break;
      case "t-exit":
        if (history.replaceState) history.replaceState(null, "", pageURL()); else location.hash = "";
        render(); window.scrollTo(0, 0); break;
    }
  });

  app.addEventListener("keydown", function (e) {
    if ((e.key === "Enter" || e.key === " ") && e.target && e.target.getAttribute && e.target.getAttribute("data-act") === "mission") {
      e.preventDefault(); e.target.click();
    }
  });

  app.addEventListener("change", function (e) {
    var el = e.target;
    if (el && el.tagName === "INPUT" && el.getAttribute("data-k")) {
      var v = parseInt(el.value, 10);
      tally[el.getAttribute("data-k")] = isNaN(v) ? 0 : Math.max(0, Math.min(999, v));
      saveTally(); renderTeacher();
    }
  });

  window.addEventListener("hashchange", function () { render(); window.scrollTo(0, 0); });

  render();
})();
</script>
</body>
</html>
